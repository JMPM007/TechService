
name: Analisis estatico ESLint

on:
  push:
    branches:
      - '**'

  pull_request:
    branches:
      - develop
      - main

jobs:
  eslint:
    name: Verificar calidad del codigo
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [windows-latest]

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar analisis estatico
        run: npm run lint -- --max-warnings 0
